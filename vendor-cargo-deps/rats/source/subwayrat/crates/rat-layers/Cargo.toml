[package]
name = "rat-layers"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Ordered layer stack with visibility, locking, and item ownership"

[features]
default = ["serde"]
serde = ["dep:serde", "uuid/serde"]

[dependencies]
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1.0"