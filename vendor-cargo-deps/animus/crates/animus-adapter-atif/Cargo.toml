[package]
name = "animus-adapter-atif"
description = "Pure no_std ATIF-v1.7 interchange contracts for Animus."
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "../../README.md"
rust-version = "1.85"
version = "0.1.0"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(animus_octet)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
module_name_repetitions = { level = "allow", priority = 1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"

[features]
default = []
json-codec = ["dep:serde", "dep:serde_json"]

[dependencies]
blake3 = { version = "1.8.5", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive"], optional = true }
serde_json = { version = "1.0.149", default-features = false, features = ["alloc"], optional = true }
