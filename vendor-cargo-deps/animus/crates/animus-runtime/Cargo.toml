[package]
name = "animus-runtime"
description = "Reusable Steel-backed agent loop runtime for animus."
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "../../README.md"
rust-version = "1.85"
version = "0.1.0"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(animus_octet)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
module_name_repetitions = { level = "allow", priority = 1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"

[features]
default = ["compat", "steel"]
all-families = [
  "batch",
  "compaction",
  "dataset-export",
  "headless",
  "loop",
  "policy",
  "provenance",
  "quality",
  "research",
  "scaffold",
  "status",
  "worker-team",
]
compat = ["all-families", "steel"]
autonomous-gates = []
persistent-goals = []
schedule-reliability = []
session-event-replay = ["animus-session-core/session-event-replay"]
execution-backend-planner = []
native-evaluation = ["dep:animus-eval-core"]
harbor-eval = ["native-evaluation", "animus-adapters/evaluation", "animus-adapters/harbor-atif", "dep:animus-adapter-atif"]
pijul-vcs-adapter = ["dep:serde", "dep:serde_json"]
trajectory-transcript-adapter = ["dep:serde_json"]
batch = []
compaction = []
dataset-export = []
headless = []
loop = []
policy = []
provenance = []
quality = []
research = []
rlm-kernel = [
  "dep:animus-steel",
  "animus-steel/rlm-kernel",
  "steel",
]
scaffold = []
status = []
worker-team = []
steel = ["dep:animus-steel"]

[dependencies]
animus-adapter-rlm-kernel = { path = "../animus-adapter-rlm-kernel", version = "0.1.0" }
animus-adapter-atif = { path = "../animus-adapter-atif", version = "0.1.0", optional = true }
animus-adapters = { path = "../animus-adapters", version = "0.1.0" }
animus-core = { path = "../animus-core", version = "0.1.0" }
animus-eval-core = { path = "../animus-eval-core", version = "0.1.0", optional = true }
animus-session-core = { path = "../animus-session-core", version = "0.1.0" }
animus-steel = { path = "../animus-steel", version = "0.1.0", optional = true }
blake3 = { version = "1.8.5", default-features = false }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.149", optional = true }

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
