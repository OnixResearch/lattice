[package]
name = "ucan-core"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "No-std UCAN capability and request-admission core."
repository = "https://github.com/OnixResearch/ucan"
readme = "../../README.md"
keywords = ["ucan", "capabilities", "no-std"]
categories = ["authentication", "no-std"]

[features]
default = []
peer-auth = ["dep:blake3", "dep:hmac", "dep:sha2", "dep:zeroize"]

[dependencies]
blake3 = { version = "=1.8.5", default-features = false, features = ["pure"], optional = true }
hmac = { version = "=0.12.1", default-features = false, optional = true }
sha2 = { version = "=0.10.9", default-features = false, optional = true }
zeroize = { version = "=1.8.2", default-features = false, optional = true }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
