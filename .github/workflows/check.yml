name: check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: UTC
      RUST_BACKTRACE: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Record Nix version
        run: |
          nix --version
          git --version

      - name: Rewrite GitHub SSH dependencies to HTTPS
        run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/

      - name: Record toolchain versions
        run: nix develop . -c sh -c 'rustc --version; cargo --version; nickel --version'

      - name: Run hardened check harness
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: ./scripts/check.rs

      - name: Run Octet precommit gate
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: nix develop . -c octet-precommit-check

      - name: Run Nix flake checks
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: nix flake check -L --option secret-key-files ''

      - name: Verify gates left no tracked changes
        if: success() || failure()
        run: |
          git status --short
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"
