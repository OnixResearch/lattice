[octet]
# Octet uses `deny` for error-level lint findings. Keep `disabled_lints`
# omitted so every registered lint is active.

[octet.lint_levels]
compound_assertion = "warn"
function_length = "warn"
acronym_style = "warn"
numeric_units = "warn"
magic_number = "warn"
excessive_file_length = "warn"
module_file_count = "warn"
underscore_in_module_filename = "warn"
non_trait_imports = "warn"
renamed_imports = "warn"
path_segment_repetition = "warn"
unbounded_loop = "warn"
compound_condition = "warn"
verified_purity = "warn"
unjustified_allow = "warn"
nested_conditionals = "warn"
assertion_density = "warn"
multi_lock_ordering = "warn"
explicit_defaults = "warn"
unbounded_channel = "warn"
unbounded_collection_growth = "warn"
sentinel_fallback = "warn"
usize_in_public_api = "warn"
borrowed_argument_types = "warn"
deref_polymorphism = "warn"
clone_then_borrow = "warn"
too_many_parameters = "warn"
negated_predicate = "warn"
bool_naming = "warn"
ignored_result = "warn"
drop_must_use = "warn"
fallible_int_fallback = "warn"
unchecked_narrowing = "warn"
unchecked_division = "warn"
contradictory_time = "warn"
ambient_clock = "warn"
catch_all_on_enum = "warn"
platform_dependent_cast = "warn"
float_for_currency = "warn"
ambiguous_params = "warn"
raw_arithmetic_overflow = "warn"
no_unwrap = "warn"
no_panic = "warn"
public_unsafe_api = "warn"
no_todo = "warn"
unjustified_no_todo_allow = "warn"
no_recursion = "warn"
