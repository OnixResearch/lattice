[package]
name = "n8nclone"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[[bin]]
name = "n8nclone"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.50", features = ["full"] }
futures = "0.3.32"
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
clap = { version = "4.6", features = ["derive", "env"] }
thiserror = "2.0.18"
snafu = "0.9"
bytes = "1.11"
chrono = { version = "0.4.44", features = ["serde"] }
rand = "0.10"
hex = "0.4.3"
url = "2.5"
parking_lot = "0.12.5"

# Optional simulation testing
madsim = { version = "0.2.34", features = ["macros"], optional = true }

# Optional property-based testing
bolero = { version = "0.13.4", optional = true }
bolero-generator = { version = "0.13.5", optional = true }
proptest = { version = "1.11", optional = true }
redb = "3.1.1"
nickel-lang-core = "0.17.0"
blake3 = "1.8.3"
crossterm = "0.29.0"
ratatui = "0.30.0"
rat-nodegraph = { git = "ssh://git@github.com/brittonr/rats.git", version = "0.1.0" }
rat-widgets = { git = "ssh://git@github.com/brittonr/rats.git", version = "0.1.0" }
rat-keymap = { git = "ssh://git@github.com/brittonr/rats.git", version = "0.1.0" }
rat-fuzzy = { git = "ssh://git@github.com/brittonr/rats.git", version = "0.1.0" }
rat-streaming = { git = "ssh://git@github.com/brittonr/rats.git", version = "0.1.0" }
rat-layers = { git = "ssh://git@github.com/brittonr/rats.git", version = "0.1.0" }
rat-canvas = { git = "ssh://git@github.com/brittonr/rats.git", version = "0.1.0" }
rat-tree = { git = "ssh://git@github.com/brittonr/rats.git", version = "0.1.0" }
rat-table = { git = "ssh://git@github.com/brittonr/rats.git", version = "0.1.0" }
rat-editor = { git = "ssh://git@github.com/brittonr/rats.git", version = "0.1.0" }
home = "0.5.12"
dirs-next = "2.0.0"

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.27"
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
tokio-test = "0.4.5"

[features]
default = []
simulation = ["dep:madsim"]
property-testing = ["dep:bolero", "dep:bolero-generator", "dep:proptest"]
