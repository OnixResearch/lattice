[package]
name = "lattice"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Graph-native workflow and agent runtime with durable local execution"
repository = "https://github.com/OnixResearch/lattice"
homepage = "https://github.com/OnixResearch/lattice"
readme = "README.md"
keywords = ["workflow", "automation", "agents", "nickel", "orchestration"]
categories = ["command-line-utilities", "development-tools"]

[workspace]
# The root package is implicit; listing "." shadows nested workspace exclusions.
members = [
  "crates/budget-ledger-core",
  "crates/lattice-core",
  "crates/lattice-compose-binding",
  "crates/lattice-workflow-contract",
  "crates/lattice-workflow-contract/transport",
]
default-members = ["."]
exclude = [
  "compose",
  "vendor-cargo-deps/bounded-exec",
  "vendor-cargo-deps/rats",
  "vendor-cargo-deps/animus",
  "vendor-cargo-deps/basalt",
  "vendor-cargo-deps/basalt/vendor/ucan",
  "vendor-cargo-deps/basalt/vendor/ucan/vendor/verified-logic",
  "vendor-cargo-deps/host-control",
  "vendor-cargo-deps/host-control/crates/host-control-core",
  "vendor-cargo-deps/hardened-wasmtime-runtime",
  "vendor-cargo-deps/mantle",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
version = "0.1.0"

[workspace.dependencies]
blake3 = "1.8.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.metadata.octet]
default_scope = ["-p", "lattice"]
cargo_check_args = ["--lib"]

[[bin]]
name = "lattice"
path = "src/main.rs"

[dependencies]
budget-ledger-core = { path = "crates/budget-ledger-core" }
lattice-core = { path = "crates/lattice-core" }
lattice-workflow-contract = { path = "crates/lattice-workflow-contract" }
lattice-workflow-transport = { path = "crates/lattice-workflow-contract/transport" }
tokio = { version = "1.50", features = ["full"] }
futures = "0.3.32"
async-trait = "0.1.89"
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
clap = { version = "4.6", features = ["derive", "env"] }
thiserror = "2.0.18"
snafu = "0.9"
bytes = "1.11"
chrono = { version = "0.4.44", features = ["serde"] }
rand = "0.10"
hex = "0.4.3"
url = "2.5"
parking_lot = "0.12.5"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }

redb = "3.1.1"
content-identity-core = { git = "https://seed.radicle.garden/zA14jhTdwST4PxPBdsryc4zS7Kpq.git", rev = "7f55597b5dc879b7601856e8d7fd0dbacaa2a498" }
transactional-reconciliation-core = { git = "https://seed.radicle.garden/z4Tky6zvC8w4Y6c4YBzNxVbq5n752.git", rev = "eb2bd3441753af97bfcb247cef7cc22d72675b62" }
nickel-eval = { git = "https://seed.radicle.garden/z21miuQLqLwe1HkaMu2mEZy5fdG9F.git", rev = "f23be09e41337de8fa729274f50023f861ae0e8a" }
blake3 = "1.8.3"
crossterm = "0.29.0"
ratatui = "0.30.0"
choregraph-choreography = { git = "https://seed.radicle.garden/zL2ncTUeASVYwcoGkEXv9JKgGbAF.git", rev = "0b2000edaf86d5a7a8601246afbc0d526f4a2a07" }
choregraph-core = { git = "https://seed.radicle.garden/zL2ncTUeASVYwcoGkEXv9JKgGbAF.git", rev = "0b2000edaf86d5a7a8601246afbc0d526f4a2a07" }
choregraph-kamacite = { git = "https://seed.radicle.garden/zL2ncTUeASVYwcoGkEXv9JKgGbAF.git", rev = "0b2000edaf86d5a7a8601246afbc0d526f4a2a07" }
choregraph-nickel = { git = "https://seed.radicle.garden/zL2ncTUeASVYwcoGkEXv9JKgGbAF.git", rev = "0b2000edaf86d5a7a8601246afbc0d526f4a2a07" }
seaglass-execution-graph = { package = "choregraph-seaglass", git = "https://seed.radicle.garden/zL2ncTUeASVYwcoGkEXv9JKgGbAF.git", rev = "0b2000edaf86d5a7a8601246afbc0d526f4a2a07" }
cap-root-core = { git = "https://seed.radicle.garden/z3cWBCK7VPbEmbL5MAvKJWKjCE745.git", rev = "545e77e5a49e4e1d34037aa9a82d924944ac0a1b" }
basalt = { path = "vendor-cargo-deps/basalt", default-features = false, features = ["oidc-exchange", "durable-authority"] }
rat-nodegraph = { path = "vendor-cargo-deps/rats/source/subwayrat/crates/rat-nodegraph" }
rat-widgets = { path = "vendor-cargo-deps/rats/source/subwayrat/crates/rat-widgets" }
rat-keymap = { path = "vendor-cargo-deps/rats/source/subwayrat/crates/rat-keymap" }
rat-fuzzy = { path = "vendor-cargo-deps/rats/source/subwayrat/crates/rat-fuzzy" }
rat-streaming = { path = "vendor-cargo-deps/rats/source/subwayrat/crates/rat-streaming" }
rat-layers = { path = "vendor-cargo-deps/rats/source/subwayrat/crates/rat-layers" }
rat-canvas = { path = "vendor-cargo-deps/rats/source/subwayrat/crates/rat-canvas" }
rat-tree = { path = "vendor-cargo-deps/rats/source/subwayrat/crates/rat-tree" }
rat-table = { path = "vendor-cargo-deps/rats/source/subwayrat/crates/rat-table" }
rat-editor = { path = "vendor-cargo-deps/rats/source/subwayrat/crates/rat-editor" }
home = "0.5.12"
cap-std = "4.0.2"
bounded-exec = { path = "vendor-cargo-deps/bounded-exec/crates/bounded-exec" }
which = "8.0.0"
animus-adapters = { path = "vendor-cargo-deps/animus/crates/animus-adapters" }
animus-runtime = { path = "vendor-cargo-deps/animus/crates/animus-runtime", default-features = false, features = ["steel"] }
animus-steel = { path = "vendor-cargo-deps/animus/crates/animus-steel" }
animus-std-secretspec = { path = "vendor-cargo-deps/animus/crates/animus-std-secretspec", optional = true }
hardened-wasmtime-runtime = { path = "vendor-cargo-deps/hardened-wasmtime-runtime/crates/hardened-wasmtime-runtime" }
hardened-wasmtime-shell = { path = "vendor-cargo-deps/hardened-wasmtime-runtime/crates/hardened-wasmtime-shell" }
mantle-build-contract = { path = "vendor-cargo-deps/mantle/crates/mantle-build-contract", default-features = false }
mantle-wasm-consumer-verifier = { path = "vendor-cargo-deps/mantle/crates/mantle-wasm-consumer-verifier" }
valence-core = { git = "https://github.com/OnixResearch/valence.git", rev = "15e72b5a330b08139ac7c809ac31e7e87f825b22" }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
nickel-lang-core = "=0.18.0"
pretty_assertions = "1.4"
tempfile = "3.27"
tokio-test = "0.4.5"
lattice-repository-validation-fixture = { path = "tests/fixtures/repository-validation/vendor-dependency" }
portable-pty = "0.9.0"
toml = "0.9"
trybuild = "1.0.116"
nix = { version = "0.31", default-features = false, features = ["user"] }
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
crunch-wasm-component-core = { path = "vendor-cargo-deps/mantle/crates/crunch-wasm-component-core" }

[features]
default = []
animus-secretspec = ["dep:animus-std-secretspec"]

[patch.crates-io]
nickel-lang-core = { path = "vendor-cargo-deps/nickel-lang-core-0.18.0" }

# Upstream manifests still name these public repositories over SSH. Patch the
# exact revisions to their anonymous HTTPS sources so the public build closure
# does not require an SSH key or a writable GitHub account.
[patch."ssh://git@github.com/OnixResearch/onix-artifact.git"]
artifact-auth-core = { git = "https://github.com/OnixResearch/onix-artifact.git", rev = "5f3962d7471d1547e044f57daeda72f56621fd52" }
artifact-auth-ed25519 = { git = "https://github.com/OnixResearch/onix-artifact.git", rev = "5f3962d7471d1547e044f57daeda72f56621fd52" }

[patch."ssh://git@github.com/OnixResearch/trellis.git"]
verified-logic = { git = "https://github.com/OnixResearch/trellis.git", rev = "d65974b14978e1a44b0f5067beb9ef6d83317dc8" }
